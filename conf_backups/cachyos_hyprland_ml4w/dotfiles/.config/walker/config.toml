theme = "ml4w"
force_keyboard_focus = false
close_when_open = true
click_to_close = true
single_click_activation = true
resume_last_query = false
debug = false
page_jump_items = 10

[columns]
symbols = 10
unicode = 10

[providers.max_results_provider]
symbols = 60

[placeholders]
default = { input = "Search", list = "No Results" }

[providers]
# Lite minimal: apps + calculator in the same search box.
# Everything else is on-demand via prefix, so no background indexing.
default = [
  "desktopapplications",
  "calc",
]
empty = ["desktopapplications"]
max_results = 20

[[providers.prefixes]]
prefix = "="
provider = "calc"

[[providers.prefixes]]
prefix = ">"
provider = "runner"

[[providers.prefixes]]
prefix = ":"
provider = "clipboard"

[[providers.prefixes]]
prefix = "/"
provider = "files"

[[providers.prefixes]]
prefix = "@"
provider = "websearch"

[providers.clipboard]
time_format = "relative"

[providers.actions]
calc = [
  { action = "copy", default = true, bind = "Return" },
]

desktopapplications = [
  { action = "start", default = true, bind = "Return" },
  { action = "new_instance", label = "new instance", bind = "ctrl Return" },
]

runner = [
  { action = "run", default = true, bind = "Return" },
  { action = "runterminal", label = "run in terminal", bind = "shift Return" },
]
