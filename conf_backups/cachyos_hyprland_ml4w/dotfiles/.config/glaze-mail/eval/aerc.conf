[ui]
mouse-enabled = true
new-message-bell = false
index-columns = flags:4,name<20%,labels<20%,subject,date>=
column-labels = {{.Labels | join ", "}}
column-separator = " │ "
styleset-name = glaze
stylesets-dirs = /home/narol/.config/glaze-mail/eval/stylesets

[hooks]
mail-received = /home/narol/.config/gcal/.venv/bin/python /home/narol/.local/src/glaze-mail/toast.py

[viewer]
alternatives = text/html,text/plain
html-inline-images = true
pager = /usr/bin/less -Rc --lesskey-src=/home/narol/.config/glaze-mail/eval/lesskey

[compose]
editor = /usr/bin/nano

[openers]
text/plain = /usr/bin/gnome-text-editor --standalone
text/html = /home/narol/.local/share/glaze-mail/preview-venv/bin/python /home/narol/.local/src/glaze-mail/preview.py open-html --aerc-export

[filters]
text/plain = /usr/lib/aerc/filters/colorize
text/html = /home/narol/.local/share/glaze-mail/preview-venv/bin/python /home/narol/.local/src/glaze-mail/preview.py text
