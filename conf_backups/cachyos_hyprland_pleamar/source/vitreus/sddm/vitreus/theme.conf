[General]
# The pictures are made by ../install.sh from the image you give it (background.jpg sharp, background-blur.jpg blurred); avatar.png is your ~/.face if there is one.
background=background.jpg
blur=background-blur.jpg
avatar=avatar.png
# Where your face is kept for the greeter to read, which cannot read your home folder: a folder of yours that install.sh makes (Vitreus's Settings and refresh-avatar.sh copy your new face there, with no sudo).
shared=/usr/local/share/vitreus-greeter
# The colours, from Vitreus's palette (install.sh writes them): the accent, the text, and the glass.
accent=#9ed6bd
ink=#f5f7f5
glass=#1b2127
# A 24 hour clock
clock24=false
