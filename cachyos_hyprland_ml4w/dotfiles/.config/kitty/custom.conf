# Kitty splits mirroring Windows Terminal muscle memory (one bind per direction).
# Splits stay inside the same OS window (sub-tabs/panes), same cwd as current pane.
#   Ctrl+Alt+D = split side-by-side (right)  [WT: SplitPaneRight]
#   Ctrl+Alt+S = split stacked (down)        [WT: SplitPaneDown]
#
# splits MUST be the default layout: --location is only honored by the
# splits layout ( Tall / Fat / Vertical place new windows their own way ).
# tall + stack stay available via Ctrl+Shift+L.
enabled_layouts splits,tall,stack
# --allow-fallback=shifted,ascii keeps letter shortcuts on the same physical
# keys in non-Latin layouts (ara): ascii falls back to the US position when
# the key produces a non-ASCII char; shifted preserves Shift behavior.
map --allow-fallback=shifted,ascii ctrl+alt+d launch --location=vsplit --cwd=current
map --allow-fallback=shifted,ascii ctrl+alt+s launch --location=hsplit --cwd=current

# Pane focus with Hyprland fallthrough; Alt+arrows are reserved for Hyprland windows.
# smart-focus.py is a no-UI kitten: native pane focus runs in-process.
# Only at a genuine edge, two bounded local IPC requests check Kitty's PID
# and exact source address before moving Hyprland focus. No processes or daemon.
map --allow-fallback=shifted,ascii alt+j kitten smart-focus.py left
map --allow-fallback=shifted,ascii alt+l kitten smart-focus.py right
map --allow-fallback=shifted,ascii alt+i kitten smart-focus.py up
map --allow-fallback=shifted,ascii alt+k kitten smart-focus.py down

# Absolute resize (WT-style): same key moves the divider the same direction
# regardless of focused pane. Implemented by absolute-resize.py (this dir,
# must stay executable): it reads the split tree via `kitty @ ls` to find
# which side of the nearest same-axis divider owns the active pane, then
# grows/shrinks it in place. Focus never moves. Needs no
# `allow_remote_control` — the `remote_control_script` action grants this
# script alone a private control socket.
# Verified: left/right on two side-by-side panes and up/down on two stacked
# panes move the divider in the arrow's direction from either focused pane.
# Nested splits: Kitty resizes the focused pane's nearest split on that axis;
# when it has neighbors on both sides, these keys move that one divider in
# either direction, not both surrounding dividers independently.
map --allow-fallback=shifted,ascii ctrl+alt+j remote_control_script absolute-resize.py left
map --allow-fallback=shifted,ascii ctrl+alt+l remote_control_script absolute-resize.py right
map --allow-fallback=shifted,ascii ctrl+alt+i remote_control_script absolute-resize.py up
map --allow-fallback=shifted,ascii ctrl+alt+k remote_control_script absolute-resize.py down

# Native override (needs the ORS kitty patch): at config load,
# native-resize-maps.py prints later `resize_divider` maps for the same
# keys when this build has the patch (later maps win); on stock kitty it
# prints nothing so the script maps above stay, firing a one-time alert.
geninclude /home/narol/.config/kitty/native-resize-maps.py

# Resize alternatives (no new binding needed, always available):
#   Ctrl+Shift+R then arrows/hjkl, Enter to commit  (resize mode)
#   Mouse: drag any pane border

# Close pane: Ctrl+W (Ctrl+Shift+W still works as default alias).
map --allow-fallback=shifted,ascii ctrl+w close_window

# Left-drag select auto-copies to system clipboard (select-to-copy).
copy_on_select clipboard
